<section id="home"><div class="hero"><span class="pill">LEVEL 2 • BUILDING YOUR VOLLEYBALL SKILLS</span><h1>VOLLEYBALL<br>SKILLS LAB</h1><p>This is the work unit. Read deeply, study technique, analyze court situations, complete interactive applications, and then pass a 12-question assessment. Volleyball IQ is earned, not clicked.</p><div class="player"><input id="name" placeholder="Player name"><button id="lock" class="primary">LOCK IN PLAYER</button></div><div id="welcome"></div><div class="player"><button id="boardBtn" class="secondary">🏆 HIGHSCORES</button><button id="resetBtn" class="danger">↻ RESET THIS PLAYER</button></div></div><div id="grid" class="grid"></div></section>
<section id="lesson" class="hidden"></section><section id="board" class="card hidden"><h2>🏆 Unit 2 Highscores</h2><div id="rows"></div><button class="secondary" onclick="goHome()">← Back</button></section></main>
<script>
const modules=[{"id": "2P", "icon": "🏛️", "title": "The Pyramid of Organized Volleyball", "subtitle": "Recreation → School → Club → College → Professional → Elite", "cards": [["1. Recreation: Where the Game Opens Up", "Recreational volleyball is the broadest entry point into the sport. Community centers, parks, after-school programs, camps, church leagues, open gyms, and beginner leagues can all introduce players to volleyball without requiring an advanced résumé. The goal is participation, learning, and repeated contact with the ball. Competition can still be real, but recreation usually gives athletes room to experiment with serving, passing, setting, and court movement before specialization becomes important.\n\nRecreation matters because it creates access. A player can discover the sport here, build coordination, learn the rules, and decide whether to pursue more competitive opportunities. Strong athletes may move upward later, but the pyramid does not say recreation is “bad volleyball.” It says recreation has a different purpose: bring more people into the game and build a foundation."], ["2. School Volleyball: Representing a Team and Community", "School volleyball adds selection, team roles, scheduled practices, competition against other schools, and responsibility to teammates. Depending on the school, athletes may compete at elementary, middle-school, junior-varsity, or varsity levels. Players begin learning that being on a team means more than possessing one strong skill. Coaches evaluate effort, attendance, communication, decision-making, coachability, consistency, and the ability to perform a role.\n\nSchool seasons are often shorter than club seasons, so practices move quickly. A player may be asked to learn rotations, serve-receive patterns, defensive responsibilities, and position-specific skills while also handling academics. The school level is where many athletes first experience tryouts, lineups, substitutions, wins, losses, and the pressure of representing something larger than themselves."], ["3. Club Volleyball: More Repetitions and Wider Competition", "Club volleyball generally operates outside the school season and can provide a longer training cycle, tournaments, travel, and competition against teams from a wider area. Clubs vary enormously. Some are local and developmental; others travel extensively and pursue highly competitive events. The label “club” does not automatically mean elite. What changes is the structure: athletes often receive more volleyball-specific repetitions and may train with teammates selected from several schools.\n\nClub can help athletes improve because they see different opponents and systems. It can also demand more time, money, travel, and family commitment. Players should judge a club by coaching quality, development, role, schedule, culture, and fit rather than assuming the most expensive or famous option is automatically best."], ["4. College Volleyball: NCAA Division III", "NCAA Division III emphasizes academics and the overall college experience. Division III schools do not offer athletic scholarships, although students may receive other forms of financial aid. Volleyball is still competitive, and athletes still practice, train, travel, and compete seriously. The absence of athletic scholarships does not mean the absence of talented players.\n\nFor a young athlete, Division III is important to understand because “college volleyball” is not one single level. A student can pursue challenging academics and competitive volleyball at hundreds of institutions with different sizes, locations, majors, and team cultures. Finding the right college fit involves much more than chasing the largest arena."], ["5. College Volleyball: NCAA Division II", "NCAA Division II is designed around a balance of athletics and academics and can offer partial athletic scholarships. Competition is strong, schedules are demanding, and athletes are expected to manage college coursework alongside training and travel. Division II programs vary in size, resources, conference strength, and recruiting needs.\n\nFor developing players, this level demonstrates why versatility matters. A college coach may value an athlete who can serve consistently, pass in multiple rotations, defend, communicate, and adapt rather than a player who looks impressive only in one drill. Reliable skills create opportunities."], ["6. College Volleyball: NCAA Division I", "NCAA Division I generally includes the highest level of NCAA competition, larger athletic programs and budgets, national exposure, and athletic-scholarship opportunities. The speed of the game increases. Serves are more difficult, attackers contact higher and faster, setters run quicker offenses, blockers read more efficiently, and defenders have less time to react.\n\nDivision I should not be treated as the only definition of success. It is one pathway with extremely demanding competition. A player interested in college volleyball should care about academic fit, playing opportunity, coaching, team culture, finances, and long-term goals in addition to the division label."], ["7. Professional Volleyball and the VLA", "After college, some athletes continue into professional volleyball. Professional opportunities can include domestic leagues and leagues in other countries. In the United States, the Volleyball League of America (VLA) operates a men's league with teams organized into tiers and regions. Professional volleyball is narrower than college volleyball because relatively few athletes reach a level where playing the sport can continue beyond school.\n\nProfessional athletes are not performing mysterious new fundamentals. They are performing familiar skills with exceptional speed, accuracy, physical ability, tactical awareness, and consistency. Their platform still has an angle. Their setter still has to locate the ball. Their blocker still has to read. Their defender still has to get stopped."], ["8. National and International Elite Pathways", "At the narrowest point of the pyramid are national-team and international opportunities. Athletes at this level compete against the strongest players from other countries and train in high-performance environments. The number of available positions becomes extremely small, which is why the pyramid narrows dramatically.\n\nThe lesson is not that every young athlete must reach the top. The lesson is that every level is connected. Recreation creates access. School and club build experience. College provides multiple competitive pathways. Professional and national-team volleyball show what highly developed fundamentals can become. Players climb by improving what they can control today."]], "video": null, "diagramType": "pyramid", "activity": {"title": "Build the Volleyball Pathway", "bins": ["FOUNDATION", "DEVELOPMENT", "COLLEGE", "POST-COLLEGE / ELITE"], "items": [["Recreation league", 0], ["Middle-school team", 0], ["Travel club tournament", 1], ["Advanced club training", 1], ["NCAA Division III", 2], ["NCAA Division II", 2], ["NCAA Division I", 2], ["VLA / professional league", 3], ["National-team pathway", 3]]}, "scenarios": [["A 6th grader has played only recreation volleyball but wants more competition. What is the most logical next move?", "Explore a school or developmental club opportunity and keep building fundamentals."], ["A player says Division III is not 'real college volleyball' because it does not award athletic scholarships. What is wrong with that claim?", "Division III is competitive NCAA volleyball; its scholarship model is different, not its status as college athletics."], ["A player wants to jump from beginner volleyball directly to elite recruiting showcases. What does the pyramid suggest?", "Build reliable skills and competition experience first instead of skipping developmental levels."]], "questions": [["Why is recreation shown at the broad base of the pyramid?", ["It creates the widest access to learning and participation", "It contains only athletes preparing for professional contracts", "It requires more travel than every other volleyball level", "It has stricter recruiting rules than college competition"], 0], ["What is a major difference between school and recreational volleyball?", ["School teams add defined roles, schedules, and team responsibility", "School teams remove the need to learn rotations and positions", "Recreation always uses more advanced offensive systems", "Recreation requires athletes to represent a specific school"], 0], ["Why can club volleyball accelerate development?", ["It can provide more repetitions and wider competition", "Every club automatically provides elite national coaching", "Club players no longer need to compete for team roles", "It replaces the need for school and academic responsibilities"], 0], ["Which statement correctly describes NCAA Division III?", ["It has competitive athletics but no athletic scholarships", "It is the only NCAA division with academic requirements", "It offers the largest athletic scholarships in the NCAA", "It does not include organized intercollegiate volleyball"], 0], ["Which statement best describes NCAA Division II?", ["It emphasizes a balance of athletics and academics", "It prohibits all forms of athletic scholarship support", "It is recreational competition without national events", "It includes only the largest universities in the country"], 0], ["What generally distinguishes NCAA Division I?", ["High competition, resources, exposure, and scholarship opportunities", "No organized recruiting or athletic scholarship opportunities", "A rule requiring every athlete to become professional afterward", "Less training and travel than most school volleyball teams"], 0], ["What is the VLA in this pathway?", ["A U.S. professional men's volleyball league", "The NCAA organization that controls Division III", "A recreation program for first-time youth players", "The international federation governing all volleyball"], 0], ["Why does the pyramid narrow toward professional and national-team play?", ["Far fewer athletes meet the increasing performance demands", "The volleyball court becomes smaller at higher levels", "Elite teams are allowed to use fewer players in a match", "Athletes stop practicing once they reach college volleyball"], 0], ["What lesson does elite volleyball teach about fundamentals?", ["Basic skills remain essential but are executed faster and better", "Elite players replace passing and setting with advanced contacts", "Professional players no longer need serve-receive systems", "Fundamentals matter only until athletes enter college"], 0], ["Which choice shows the healthiest way to think about the pyramid?", ["Use each level to develop rather than treating one label as success", "Assume Division I is the only worthwhile college outcome", "Skip local competition because it cannot develop elite skills", "Choose teams only by fame instead of coaching and opportunity"], 0], ["Why should academics matter when considering college volleyball?", ["College fit includes education as well as athletic opportunity", "Academic performance is unrelated to college participation", "Only Division III athletes are expected to attend classes", "College coaches are not permitted to consider student goals"], 0], ["Which pathway is most realistic for a developing athlete?", ["Recreation or school → club/development → college options → elite possibilities", "Recreation → national team → school → club → college", "School → professional league → recreation → college", "Club → professional league → beginner training → school"], 0]]}, {"id": "2A", "icon": "🧱", "title": "Passing (Bump)", "subtitle": "Win first contact with reading, movement, angles, seams, and control", "cards": [["1. Passing Is Controlled Rebounding", "A forearm pass is not a swing contest. The ball already arrives with energy, so the passer's job is to redirect that energy. A broad, even platform gives the ball a predictable surface. The angle of that surface matters enormously: a small change in platform angle can send the ball several feet away from the intended target."], ["2. Platform Construction", "Bring the forearms together to create one surface. Keep the elbows straight through contact and avoid one arm sitting noticeably above the other. Hand grips can vary, but the result should be symmetrical forearms. The shoulders help set the platform angle while the hands remain quiet."], ["3. Read Before You Move", "Serve receive begins before the ball crosses the net. Watch the server's body, contact, ball speed, height, and early flight. Float serves can move unpredictably because they have little spin. Topspin serves tend to dip more sharply. Reading buys time, and time creates balance."], ["4. Feet Solve Problems", "Move early with efficient steps. Avoid crossing wildly or running through the ball when a shuffle or small adjustment will work. The goal is to arrive behind the ball and become balanced at contact. When the feet are late, the arms start making emergency corrections."], ["5. Platform Angle and Target", "Imagine the forearms as a ramp. The ball rebounds away from that ramp. If the platform points too high, the pass may sail. If it points too low, the ball may die in front. If one shoulder drops, the pass can leak sideways. Great passers learn to create the angle before contact instead of changing it during contact."], ["6. Passing Hard vs. Soft Serves", "A hard serve brings more energy, so the passer often needs less added force. Absorb and redirect it. A slower serve may require more movement from the legs and body to send the ball to target. Using the same giant arm swing for every serve ignores the physics of the incoming ball."], ["7. Seams and Communication", "A seam is the space between two passers. Servers attack seams because hesitation can create an ace. Teams need communication rules: who takes short balls, who owns the seam, and which passer has priority. Calling 'mine' early is useful only if players understand the team's responsibilities."], ["8. Passing Out of System", "Not every pass will be perfect. A pass that keeps the setter or another teammate capable of making the second contact is still valuable. When a perfect target is impossible, choose control. Sending the ball high into a playable area is usually better than attempting a heroic pass that becomes an overpass or error."], ["9. Finish and Transition", "Hold the platform angle briefly after contact instead of twisting away. Then move immediately into the next responsibility: cover, attack, set, or defend. Passing is the beginning of the team's offense, not the end of the player's job."]], "video": "https://www.youtube.com/embed/DdMQns95WDI", "diagramType": "pass", "activity": {"title": "Passing (Bump) Technique Sort", "bins": ["STRONG TECHNIQUE", "LIKELY ERROR"], "items": [["Balanced before contact", 0], ["Even forearm platform", 0], ["Read server before flight", 0], ["Angle platform to target", 0], ["Communicate in seams", 0], ["Hold platform after contact", 0], ["Swing arms violently", 1], ["Separate elbows at contact", 1], ["Wait until ball is close to read", 1], ["Change platform during contact", 1], ["Both passers hesitate in seam", 1], ["Admire the pass and stop moving", 1]]}, "scenarios": [["A hard float serve is moving toward your right shoulder. You are still shuffling when it arrives. What should you improve first?", "Read earlier so you can finish movement and become balanced before contact."], ["Two passers both watch a serve land between them. What volleyball problem occurred?", "A seam communication and responsibility failure."], ["Your pass repeatedly flies behind the setter even though your feet reach the ball. What should you inspect?", "Your platform and shoulder angle at contact."]], "questions": [["What controls most of the rebound direction on a forearm pass?", ["The angle of the forearm platform at contact", "The number printed on the player's jersey", "The height of the passer's previous serve", "The position of the referee beside the net"], 0], ["Why should reading begin before the serve reaches the passer?", ["Early information gives the passer more time to move and balance", "Passers are required to call the score before every contact", "The ball becomes easier to catch when watched from the server", "Early reading guarantees the serve will travel to the middle"], 0], ["Why can a hard serve require less added force from the passer?", ["The incoming ball already carries significant energy", "Hard serves are legally lighter than slower volleyballs", "The setter moves closer whenever the serve is powerful", "Officials reduce the distance to target on hard serves"], 0], ["What is a seam in serve receive?", ["The space and responsibility area between two passers", "The line dividing the front row from the back row", "The gap between the antenna and the sideline", "The space separating the server from the end line"], 0], ["Why is a symmetrical platform useful?", ["It creates a more predictable surface for the rebound", "It allows the passer to briefly hold the volleyball", "It produces topspin automatically on every first contact", "It prevents the opposing team from using a block"], 0], ["What should happen when a perfect pass is impossible?", ["Prioritize a controlled playable ball for the next contact", "Swing harder so the ball reaches the exact target anyway", "Send the first contact directly over the net every time", "Stop moving and allow another player to chase the ball"], 0], ["Which cue best describes efficient passing footwork?", ["Move early, adjust, and become balanced before contact", "Sprint through the ball without stopping the feet", "Cross the feet on every serve regardless of distance", "Stay planted until the ball reaches the attack line"], 0], ["Why do servers target seams?", ["Hesitation between passers can create communication errors", "Seam serves automatically count for two points", "The seam is always the shortest distance over the net", "Officials require half of all serves to target seams"], 0], ["What is a likely result of changing platform angle during contact?", ["The rebound becomes less predictable and harder to control", "The ball automatically travels to the setter target", "The passer gains more time before the second contact", "The serve loses all of its incoming speed immediately"], 0], ["What should a passer do immediately after finishing the pass?", ["Transition into the next offensive or defensive responsibility", "Remain frozen until the setter completes the second contact", "Leave the court so a defensive specialist can enter", "Move under the net to watch where the attack lands"], 0], ["Which description best fits a float serve?", ["A serve with little spin that may move unpredictably", "A serve that must be contacted below the waist", "A serve that always travels in a high predictable arc", "A serve that can only be used by the libero position"], 0], ["A pass repeatedly sails too high. What is the best first check?", ["Inspect whether the platform angle is sending the ball upward", "Ask the setter to stand farther away from the net", "Bend the elbows more so the arms can absorb the ball", "Swing the arms faster to shorten the ball's flight"], 0]]}, {"id": "2B", "icon": "👐", "title": "Setting", "subtitle": "Become the offense's decision-maker, not just its second contact", "cards": [["1. The Setter's Real Job", "The setter connects the team's first contact to its attack. A technically beautiful set is useless if the hitter cannot attack it. USA Volleyball describes the setter as a central organizer and leader because setters repeatedly make decisions about who receives the ball, where it goes, and how quickly it arrives."], ["2. Beat the Ball to the Spot", "Foot speed matters because passes rarely land perfectly. The setter should read the pass, move quickly, and try to become stopped before contact. Drifting while setting makes direction and distance harder to control. Good setters solve movement early so their hands can solve the ball."], ["3. Neutral Body Position", "A consistent body position makes the setter more accurate and harder for blockers to read. Face the target appropriately, contact near the body's midline, and keep the contact point high. If the setter reaches far to one side, the body often twists and the set becomes less predictable."], ["4. Hands and Release", "Shape the hands around the volleyball rather than flattening them like a passing platform. The fingers contact and release the ball quickly. The goal is not to catch and throw. A consistent high contact point helps hitters read the release and helps the setter send the ball in multiple directions."], ["5. Use the Whole Body", "Setting is not just finger strength. Force travels from the floor through the legs and body into the arms and hands. Full extension improves accuracy and prevents the short, jabbed release that often sends balls off target."], ["6. Location: Give the Hitter a Window", "Setters should think in usable windows, not microscopic perfect points. An outside hitter needs enough height and distance from the net to approach and swing. A set too tight can place the hitter into the block or net. A set too low removes approach time."], ["7. Tempo Changes the Offense", "A high outside ball gives a hitter more time. A quick middle set reduces time for both hitter and blockers. Faster is not automatically better. Tempo must match the passer quality, setter skill, hitter timing, and offensive system."], ["8. Decision-Making", "A setter reads the quality of the pass, available hitters, opponent's block, score, rotation, and which teammate is attacking well. The best choice is often the hittable, repeatable option rather than the cleverest option. Deception comes after control."], ["9. Leadership Under Pressure", "Setters touch many balls and mistakes are visible. They must communicate, recover quickly, and keep teammates confident. One bad set cannot become three bad decisions. Treat each rally as a new problem."], ["10. Emergency Second Contact", "If the setter makes the first defensive contact, someone else must set. Every player should therefore practice delivering a controlled second ball. A team with multiple capable setters stays organized when the rally becomes messy."]], "video": "https://www.youtube.com/embed/sFxs0EPD68Q", "diagramType": "set", "activity": {"title": "Setting Technique Sort", "bins": ["STRONG TECHNIQUE", "LIKELY ERROR"], "items": [["Beat ball to the spot", 0], ["Stop before setting when possible", 0], ["Contact high near midline", 0], ["Extend fully to target", 0], ["Give hitter a usable window", 0], ["Choose hittable before deceptive", 0], ["Drift sideways during release", 1], ["Reach far outside the body", 1], ["Contact from inconsistent heights", 1], ["Jab with bent arms", 1], ["Set too tight to the net", 1], ["Choose tricky over controllable", 1]]}, "scenarios": [["Your outside hitter keeps getting trapped under the ball and cannot use a full approach. What should the setter evaluate?", "The set's height, distance from the net, and location window."], ["The pass forces the setter to play first contact. Who should take second contact?", "A prepared teammate using emergency-setting skills."], ["A setter fools every blocker but the hitter cannot reach the ball. Was it a good decision?", "No. A hittable ball has priority over deception."]], "questions": [["What is the setter's most important outcome?", ["Deliver a ball the attacker can use effectively", "Make every set look identical to a jump serve", "Touch the ball longer than every other player", "Send the second contact over whenever possible"], 0], ["Why should setters try to stop before contact?", ["A stable body improves direction and distance control", "The rules prohibit all movement during a set", "Stopping causes the volleyball to become lighter", "It guarantees the opposing block will be late"], 0], ["Why is a high consistent contact point useful?", ["It supports repeatable release and multiple setting options", "It allows the setter to catch the ball legally", "It forces every hitter to use the same tempo", "It prevents defenders from entering the back row"], 0], ["What is a setting window?", ["A usable range where the hitter can approach and attack", "The physical opening between the setter's hands", "The space between two blockers after they jump", "The legal zone where only setters may stand"], 0], ["Why can a set too tight to the net be dangerous?", ["It reduces hitter options and can feed the opponent's block", "It gives the hitter unlimited attacking angles", "It automatically becomes an illegal fourth contact", "It forces the back-row defenders to rotate forward"], 0], ["What should determine offensive tempo?", ["Pass quality, setter skill, hitter timing, and system", "The loudness of the crowd during the current rally", "The jersey number of the player receiving the set", "Whether the opponent served underhand or overhand"], 0], ["Which priority should come before deception?", ["Delivering a controlled and hittable ball", "Hiding the setter's position from teammates", "Making the fastest possible set every rally", "Sending every second ball behind the setter"], 0], ["Why should every player practice setting?", ["The regular setter may take the first contact", "Only setters are allowed to make a third contact", "It removes the need for serve-receive practice", "Every rotation requires a different official setter"], 0], ["What does full extension help prevent?", ["A short jabbed release that reduces accuracy", "The setter from communicating with attackers", "The ball from traveling to an outside hitter", "The opponent from using three team contacts"], 0], ["What information can influence a setter's choice?", ["Pass quality, blockers, hitters, rotation, and situation", "Only the location of the nearest line judge", "Only which player served the previous point", "The number of spectators watching the match"], 0], ["Why is setter leadership important after a mistake?", ["The offense needs quick recovery and confident communication", "A setter loses the right to touch the next ball", "The rules require a setter apology after errors", "The coach cannot communicate during volleyball matches"], 0], ["What does 'beat the ball to the spot' mean?", ["Move early enough to organize the body before setting", "Contact the ball before the first passer touches it", "Run faster than the hitter during the approach", "Send the set to the antenna before blockers move"], 0]]}, {"id": "2C", "icon": "🎯", "title": "Serving", "subtitle": "Build a repeatable weapon: routine, contact, zones, and pressure", "cards": [["1. Serving Starts the Problem", "Serving is the one major skill you initiate without an opponent sending the ball first. That control makes errors especially costly and good serving especially valuable. The server chooses the routine, target, toss or release, contact, and risk level."], ["2. Underhand Foundation", "An underhand serve teaches weight transfer, firm contact, and direction. Hold the ball steady, swing the hitting arm like a pendulum, contact the lower-back area with a firm hand or fist, and finish toward the target. It is a legitimate developmental serve, not a reason to launch the ball at the ceiling."], ["3. Overhand Mechanics", "A standing overhand serve uses a controlled toss in front of the hitting shoulder. The hitting elbow loads, the body transfers force forward, and a firm open hand contacts the ball. The toss should serve the swing, not force the server to chase it."], ["4. The Toss Is a Skill", "Many serving errors begin before the swing. Tossing too far forward, behind, or sideways changes the contact point. Practice the toss independently. A repeatable toss reduces the number of variables the server must solve under pressure."], ["5. Float Serve", "A float serve is contacted to minimize spin. When successful, air movement can make the ball shift unpredictably. The server needs a firm, clean contact through the center of the ball. Adding a wrist snap that creates heavy spin defeats the purpose."], ["6. Zones and Seams", "Serving 'in' is step one. Serving somewhere useful is step two. Deep serves can push passers backward. Short serves can force them forward. Sidelines reduce space. Seams force communication between passers. The best target depends on the opponent."], ["7. Risk and Reward", "At 24-24, a server may choose a different risk level than at 2-2, but fear should not destroy technique. A high-risk serve that misses constantly provides no pressure. A controlled serve that targets a weak passer can be more valuable than raw speed."], ["8. Serving Routine", "A routine creates familiarity: breathe, check the score, choose a target, establish the same starting position, execute the toss, contact, and finish. Under pressure, routines reduce unnecessary decisions."], ["9. Read the Result", "After serving, evaluate more than ace or no ace. Did the opponent pass off the net? Did the setter lose options? Did two passers hesitate? A serve can win strategically without touching the floor."], ["10. Serve Then Defend", "The server becomes a defender immediately after contact. Enter the court, find defensive base, and prepare for the return. Admiring a serve is an excellent way to become late to the next play."]], "video": null, "diagramType": "serve", "activity": {"title": "Serving Technique Sort", "bins": ["STRONG TECHNIQUE", "LIKELY ERROR"], "items": [["Repeatable toss", 0], ["Firm contact", 0], ["Choose a zone", 0], ["Use a consistent routine", 0], ["Target seams intentionally", 0], ["Enter defense after serving", 0], ["Chase the toss", 1], ["Change mechanics every serve", 1], ["Serve without a target", 1], ["Snap wrist on intended float", 1], ["Always choose maximum risk", 1], ["Watch serve instead of defending", 1]]}, "scenarios": [["Your  base"], 0], ["Why can an ace-only view of serving be misleading?", ["A serve can disrupt offense without touching the floor", "Only aces are recorded as legal volleyball serves", "Every non-ace serve is considered a serving error", "Aces prevent the server from serving another point"], 0], ["What does risk-reward mean in serving?", ["Balance pressure against the likelihood of missing", "Always choose the hardest serve available", "Use underhand serves only during close scores", "Change technique based on the referee position"], 0], ["What does a serving routine help reduce?", ["Unnecessary decisions and inconsistency under pressure", "The legal distance between server and end line", "The number of passers on the opponent's court", "The need to select a target before contact"], 0], ["Which contact best supports an overhand serve?", ["Firm open-hand contact in a repeatable window", "Soft palm contact while catching the ball briefly", "Two-hand contact above the server's forehead", "Forearm-platform contact after a high toss"], 0], ["What should a server study after the opponent passes?", ["Whether the serve reduced the offense's available options", "Only whether the ball touched the floor for an ace", "Whether the line judge moved during the serve", "How high the server's arm finished after contact"], 0], ["Why practice the toss separately?", ["Many serving errors begin with poor ball placement", "The toss counts as the first legal team contact", "It teaches the server how to block after serving", "The toss determines which team rotates next"], 0]]}, {"id": "2D", "icon": "💥", "title": "Hitting (Spiking)", "subtitle": "Turn footwork, timing, vision, and shot selection into offense", "cards": [["1. Attacking Is a Sequence", "A spike is not an isolated arm swing. The attacker reads the set, builds an approach, plants, jumps, draws the arm, sees the block, contacts high, lands safely, and transitions. When one link is late, the next link becomes harder."], ["2. Slow to Fast", "Approaches generally accelerate. Starting under control allows the hitter to read the set; the final steps become faster and more explosive. Running full speed immediately can make timing rigid and leave the hitter unable to adjust."], ["3. Step-Close and Takeoff", "The final two steps organize the jump. They help convert forward speed into vertical lift and put the hitter's body in a useful relationship to the ball. A hitter who flies underneath the set loses vision and attacking range."], ["4. Arm Swing", "The hitting elbow draws back as the torso rotates. The arm accelerates through contact. Power is created by coordinated movement through the body, not by throwing the shoulder forward with no control."], ["5. Contact High and in Front", "Reach high and contact in front of the hitting shoulder. A ball contacted behind the head often loses power and control. High contact also improves the angle available to send the ball into the opponent's court."], ["6. Line and Cross-Court", "A line attack travels more directly down the sideline side of the hitter. A cross-court attack travels diagonally. Block position, defensive base, and set location influence which shot is available."], ["7. Off-Speed Tools", "Tips, roll shots, and controlled placement punish defenders who retreat too deep or blockers who leave open space. Off-speed does not mean accidental. A good attacker intentionally changes speed while keeping the ball controlled."], ["8. Use the Block", "Advanced hitters can attack the blocker's hands so the ball deflects out of bounds, often called tooling the block. This requires awareness and control. The block is not only an obstacle; sometimes it becomes a target."], ["9. Out-of-System Attacking", "When the pass or set is poor, the attacker should reduce unnecessary risk. A high ball may require a controlled swing, deep roll, or smart placement rather than attempting the fastest possible kill."], ["10. Landing and Transition", "Land balanced on two feet when possible, absorb force, and get ready to play again. Volleyball rallies continue after many attacks. A hitter who stops to admire the swing has removed one player from the next phase."]], "video": null, "diagramType": "hit", "activity": {"title": "Hitting (Spiking) Technique Sort", "bins": ["STRONG TECHNIQUE", "LIKELY ERROR"], "items": [["Accelerate final steps", 0], ["Contact high and in front", 0], ["See block before swing", 0], ["Use controlled off-speed shots", 0], ["Adjust to poor sets", 0], ["Land and transition", 0], ["Sprint full speed immediately", 1], ["Contact behind the head", 1], ["Swing blindly into block", 1], ["Tip accidentally with no target", 1], ["Force maximum power out of system", 1], ["Stop playing after the attack", 1]]}, "scenarios": [["The double block completely closes cross-court but leaves line available. What should a smart hitter consider?", "Use the open line rather than blindly attacking the closed cross-court block."], ["A set is far off the net. Why might a controlled deep roll be smarter than a maximum-power swing?", "The hitter has fewer strong contact options and should manage risk."], ["A defender is standing very deep waiting for a hard swing. What attacking tool could exploit that?", "A controlled tip or short off-speed shot into open space."]], "questions": [["Why is attacking described as a sequence?", ["Footwork, timing, jump, vision, contact, and transition are connected", "Only the final arm swing affects the result of an attack", "Attackers are required to use several team contacts themselves", "The hitter must complete every skill before the setter touches"], 0], ["What does 'slow to fast' mean in an approach?", ["Build speed so the final steps are the most explosive", "Start at maximum speed and slow down before jumping", "Swing the arm slowly before accelerating the volleyball", "Use a slow set followed by a fast defensive transition"], 0], ["What is the purpose of the final step-close?", ["Organize takeoff and position the body relative to the ball", "Tell the setter exactly which rotation is currently active", "Prevent the blocker from moving toward the outside antenna", "Allow the hitter to make an additional contact before jumping"], 0], ["Why contact high and in front?", ["It improves power, control, and attacking angle", "It allows the hitter to legally hold the ball longer", "It guarantees the ball will avoid every possible block", "It prevents defenders from moving before the attack"], 0], ["What is a line attack?", ["A shot traveling more directly along the hitter's sideline", "A shot that must touch the boundary line to be legal", "A ball intentionally passed to the line judge", "A serve made from the exact center of the end line"], 0], ["Why use off-speed attacks?", ["They can exploit open space created by defensive positioning", "They count for more points than hard-driven attacks", "They prevent the opponent from using a libero", "They allow the hitter to contact the ball twice"], 0], ["What does tooling the block mean?", ["Intentionally use blocker hands to deflect the ball out", "Avoid every blocker by sending the ball under the net", "Ask the blocker to move before the hitter attacks", "Contact the net so the ball changes its direction"], 0], ["How should a hitter respond to a poor out-of-system set?", ["Manage risk and choose a controllable attacking option", "Swing harder because poor sets require maximum force", "Stop the approach and allow the ball to hit the floor", "Attempt only a sharp cross-court kill regardless of location"], 0], ["Why should attackers read the block?", ["Block position changes which attacking spaces are available", "Blockers decide whether the attacker may contact the ball", "The hitter must copy the blocker's approach footwork", "The block determines which player serves next"], 0], ["What should happen after the hitter lands?", ["Transition immediately into the next team responsibility", "Remain at the net until the rally is completely finished", "Turn away from the court to avoid interfering with defense", "Move outside the antenna and wait for another set"], 0], ["What is a roll shot?", ["A controlled off-speed attack placed into open court", "A serve that rolls along the floor before crossing the net", "A set delivered while the setter rotates on the ground", "A block that redirects the ball toward the back wall"], 0], ["Why is maximum power not always the best choice?", ["Game context may reward placement, control, or a different speed", "Hard attacks become illegal after the first set of a match", "Defenders receive an extra contact against powerful attacks", "Only middle blockers are permitted to attack at full speed"], 0]]}, {"id": "2E", "icon": "🚧", "title": "Blocking", "subtitle": "Read the offense, close space, and build one wall with the defense", "cards": [["1. Blocking Starts Before the Jump", "The blocker reads the pass, setter position, setter hands, set trajectory, hitter approach, and offensive tendencies. Jumping is the final action, not the first decision. Better information creates better positioning."], ["2. Loaded Ready Position", "Stay balanced with bent knees and weight ready to move. Standing upright costs time. Middles especially need explosive lateral movement because they may have to help block on either pin."], ["3. Distance From the Net", "Too close increases net violations and makes penetration difficult. Too far creates space for the ball to fall between blocker and net. A useful starting distance allows the athlete to move and press without crashing into the tape."], ["4. Blocking Footwork", "Short moves may use a shuffle. Longer moves may require crossover or swing-block footwork. Whatever the system, the blocker wants to arrive under control, square useful body parts to the attack, and avoid drifting through teammates."], ["5. Read the Setter", "The setter's body, pass location, and release provide clues. A perfect pass gives more offensive options. An off-net pass may reduce quick-middle threats. Blockers who understand the quality of the pass can narrow the list of likely attacks."], ["6. Read the Hitter", "Approach path, shoulder position, and contact relationship can help predict line, cross-court, tip, or high hands. The blocker should not guess wildly but should collect information until the attack becomes clearer."], ["7. Press Over, Not Only Up", "USA Volleyball blocking guidance emphasizes penetration over the net. Hands that reach across take away court and can redirect the ball downward. A tall jump with hands staying on the blocker's side leaves more space for the ball."], ["8. Close the Seam", "Two blockers need to create one connected wall. A gap between their hands gives the hitter a target. The closing blocker must arrive beside the pin blocker without flying past or colliding."], ["9. Block-Defense Relationship", "Back-row defenders position around what the block is taking away. If the block owns line, defenders can emphasize other areas. If blockers and defenders follow different plans, open court appears everywhere."], ["10. Winning Without a Stuff Block", "A block can succeed by slowing the ball, forcing a predictable shot, taking away the hitter's favorite angle, or funneling the attack toward a defender. The block is part of a defensive system, not a personal highlight contest."]], "video": "https://www.youtube.com/embed/jti8vE6BnFw", "diagramType": "block", "activity": {"title": "Blocking Technique Sort", "bins": ["STRONG TECHNIQUE", "LIKELY ERROR"], "items": [["Read pass and setter", 0], ["Stay loaded and balanced", 0], ["Arrive under control", 0], ["Press hands over net", 0], ["Close seam with teammate", 0], ["Coordinate with back-row defense", 0], ["Guess before reading", 1], ["Stand upright and late", 1], ["Drift sideways in jump", 1], ["Reach only straight upward", 1], ["Leave gap in double block", 1], ["Ignore defensive plan behind block", 1]]}, "scenarios": [["The pass is ten feet off the net. How should that information affect the middle blocker?", "Recognize that some quick options may be reduced and read the developing set."], ["Two blockers jump but leave a large gap between them. The hitter scores through it. What failed?", "The blockers failed to close the seam and form one wall."], ["Your block never touches the ball, but the hitter repeatedly attacks into your waiting defender. Is the block helping?", "Yes. It is funneling the attack into the team's defensive plan."]], "questions": [["What is the first major skill in effective blocking?", ["Reading the offense before deciding where to move", "Jumping as high as possible before the set occurs", "Watching only the volleyball after hitter contact", "Standing directly underneath the volleyball net"], 0], ["Why should blockers begin in a loaded position?", ["Bent knees support quicker and more explosive movement", "It prevents the opponent from using an outside hitter", "The rules require blockers to remain below net height", "It makes the setter's release easier to predict"], 0], ["How can pass quality help a blocker?", ["It changes which offensive options are likely available", "It determines which team receives the next serve", "It tells the blocker whether the rally counts for points", "It changes the legal height of the volleyball net"], 0], ["Why press hands over the net?", ["Penetration removes more attacking space from the hitter", "It allows the blocker to catch and throw the volleyball", "It makes the block legal even after touching the net", "It prevents the back row from needing to play defense"], 0], ["What is the seam in a double block?", ["The opening between the two blockers' blocking surfaces", "The line dividing front-row and back-row court positions", "The space between the end line and the serving player", "The gap separating the setter from the outside hitter"], 0], ["Why does blocking footwork matter?", ["The blocker must arrive balanced at the correct attack point", "Only one specific footwork pattern is legal in volleyball", "Footwork determines whether the hitter may attack cross-court", "Blockers receive an extra contact after using a crossover"], 0], ["How do the block and back-row defense work together?", ["The block removes options and defenders protect remaining space", "Defenders stand directly behind every blocker regardless of plan", "The block is responsible for every possible attacking location", "Back-row defenders may stop moving once two blockers jump"], 0], ["Can a block succeed without touching the ball?", ["Yes, it can force predictable attacks toward defenders", "No, a block only matters when it directly scores a point", "Yes, but only when the blocker is the team captain", "No, untouched blocks are recorded as defensive errors"], 0], ["Why should blockers read the hitter as well as the setter?", ["Hitter approach and body position provide attacking clues", "The hitter decides which blocker is allowed to jump", "The setter stops providing information after releasing the ball", "Officials require blockers to watch two different players"], 0], ["What can happen when a blocker starts too close to the net?", ["Net contact and poor hand penetration become more likely", "The hitter is automatically called for an attacking fault", "The blocker gains unlimited space to move laterally", "The volleyball must be replayed if the block is successful"], 0], ["What is the danger of drifting sideways during a block?", ["The blocker can open space or collide instead of forming a wall", "Sideways movement automatically counts as a fourth contact", "The setter receives an additional attacking option", "The back-row defenders must rotate to a new position"], 0], ["What is the best measure of a useful block?", ["How well it contributes to controlling the opponent's attack", "How many times the blocker touches the net during a match", "Whether the blocker jumps higher than every other player", "How loudly teammates react after the blocker leaves the floor"], 0]]}, {"id": "2F", "icon": "🛡️", "title": "Digging", "subtitle": "Turn reading, positioning, stillness, and pursuit into playable defense", "cards": [["1. Defense Begins Before Contact", "Digging looks reactive, but elite defense is full of prediction. Read the pass, setter, set location, hitter approach, shoulders, and arm. Each clue reduces the number of likely places the ball can go."], ["2. Base Position Is a Starting Point", "A defender's base is not a permanent parking spot. Position changes with the opponent's options and the team's blocking plan. A tight set, an off-net set, a strong outside hitter, and a tip-prone middle all create different problems."], ["3. Get Stopped at Hitter Contact", "USA Volleyball defenders emphasize being still when the attacker contacts the ball. A balanced athlete can react left, right, forward, or backward. A defender still sprinting one direction has already voted for where the ball will go."], ["4. See the Hitter", "Watching only the ball hides information. The hitter's approach, shoulder, elbow, hand, and body relationship to the set provide clues. Defenders should see the attacker early enough to react to what the body is preparing to do."], ["5. Work Around the Block", "Defenders should understand what their blockers are taking away. Standing directly behind a solid block may place the defender in a shadow where the ball is unlikely to travel. Defensive systems position players around the block's responsibilities."], ["6. Hard-Driven Balls", "Against a hard attack, the defender needs a strong balanced posture and a platform or defensive surface capable of controlling speed. The goal is not simply to survive contact. Whenever possible, direct the dig into a playable area."], ["7. Tips and Off-Speed Shots", "Deep defenders must still be ready to move forward. A hitter can use a tip or roll shot when defenders retreat. Reading approach speed and hand shape can provide clues, but defenders should avoid committing before the hitter actually reveals the shot."], ["8. Emergency Defense", "Some balls require sprawls, dives, one-arm extensions, or other emergency contacts. These are valuable tools, but they should not replace positioning. A spectacular dive may be necessary because the attack was great; it should not be necessary because the defender stopped reading."], ["9. Better the Ball", "A dig that flies randomly into the stands may look brave but ends the rally. When possible, control the ball high toward the middle of the court so a teammate can set. Defense becomes offense only if the team can use the next contact."], ["10. Relentless Discipline", "Great defenders combine effort with repeatable habits. Read early, move efficiently, stop at contact, react, pursue, and recover. Relentless does not mean running everywhere. It means refusing to quit while still making intelligent decisions."]], "video": "https://www.youtube.com/embed/Ix_zeZ4X9Vo", "diagramType": "dig", "activity": {"title": "Digging Technique Sort", "bins": ["STRONG TECHNIQUE", "LIKELY ERROR"], "items": [["Read hitter early", 0], ["Adjust base to attack options", 0], ["Stop at hitter contact", 0], ["Position around the block", 0], ["Control dig toward teammates", 0], ["Pursue emergency balls", 0], ["Watch only ball after contact", 1], ["Stand in same spot every rally", 1], ["Keep running at hitter contact", 1], ["Hide directly behind block", 1], ["Blast dig randomly away", 1], ["Give up when ball leaves platform range", 1]]}, "scenarios": [["You are still moving left when the hitter suddenly tips right. Why are you late?", "You were not balanced and stopped at hitter contact."], ["Your blockers are taking line, but you stand directly behind them. Where should you think about moving?", "Into a defensive area that protects an option the block is not taking away."], ["You make a difficult dig but it flies into the bleachers. What separates that from elite defense?", "Elite defenders try to control the contact so the team can make the next play."]], "questions": [["When does successful digging begin?", ["Before hitter contact through reading and positioning", "Only after the ball has crossed the volleyball net", "When the defender decides whether to dive or sprawl", "After the blocker tells the defender where the ball went"], 0], ["Why should a defender be stopped at hitter contact?", ["Balance allows faster reaction in multiple directions", "Volleyball rules prohibit movement during an attack", "Stopping forces the hitter to use an off-speed shot", "The blocker cannot jump while a defender is moving"], 0], ["Why is base position not a permanent location?", ["Attack options and the blocking plan change from rally to rally", "Defenders must rotate after every opponent contact", "The court dimensions change based on the current score", "Officials assign defenders a new spot before each attack"], 0], ["Why should defenders see the hitter instead of only the ball?", ["Body and approach clues provide information before contact", "The ball becomes invisible once the hitter begins the approach", "Officials require eye contact between hitter and defender", "Watching the hitter prevents the ball from changing direction"], 0], ["How should defenders use information from the block?", ["Protect attacking spaces that the block does not remove", "Stand directly behind the block on every single attack", "Stop moving whenever two front-row players are blocking", "Assume the block will touch every hard-driven volleyball"], 0], ["What is the goal against a hard-driven attack?", ["Control the speed into a playable defensive contact", "Swing the forearms upward as hard as possible", "Send the dig immediately back across the net", "Avoid using a platform because the ball is moving fast"], 0], ["Why must deep defenders still prepare to move forward?", ["Hitters can use tips and other off-speed attacks", "Every attack must land inside the attack line", "The setter is allowed to catch short defensive balls", "Blockers are not permitted to defend tipped volleyballs"], 0], ["What is the proper role of emergency defensive skills?", ["Save difficult balls when normal positioning cannot reach them", "Replace reading and positioning on every defensive rally", "Allow defenders to make two consecutive contacts legally", "Create a reason for defenders to begin every play on the floor"], 0], ["What does 'better the ball' mean on defense?", ["Make the defensive contact useful for the team's next play", "Contact the ball harder than the opponent's attacker did", "Send every dig directly over the net into open court", "Make sure the libero takes every defensive first contact"], 0], ["Why is a random dig into the stands less valuable?", ["The team cannot transition to another controlled contact", "The defender receives a penalty for leaving the court", "The ball automatically awards two points to the opponent", "Only setters are allowed to chase balls outside the court"], 0], ["What does relentless defense actually require?", ["Persistent effort combined with disciplined reading and movement", "Running continuously even when the hitter has not approached", "Diving on every attack to prove the defender is working hard", "Ignoring the blocking plan and chasing every possible ball"], 0], ["Which sequence best describes disciplined defense?", ["Read, move, stop, react, control, and recover", "Guess, sprint, dive, watch, and hope", "Stand, wait, turn, chase, and celebrate", "Block, serve, rotate, set, and leave court"], 0]]}];

 return `<div class="diagram"><h3>📊 ${m.title}: Decision Chain</h3><svg viewBox="0 0 900 270" style="height:auto">
 <path d="M110 145 Q280 35 450 145 T790 145" fill="none" stroke="#475569" stroke-width="7"/>
 ${a.map((x,i)=>`<circle cx="${x[1]}" cy="${x[2]}" r="48" fill="${i%2?'#7c3aed':'#0891b2'}"/><text x="${x[1]}" y="${x[2]+6}" text-anchor="middle" font-size="15" font-weight="900" fill="white">${x[0]}</text>`).join("")}
 </svg><div class="diagram-note">Do not memorize these as isolated words. The skill works because each decision prepares the next one.</div></div>`;
}
function scenarios(m){
 return `<div class="read"><div class="kicker">COURT IQ • ERROR ANALYSIS</div><h3>🏐 Read the Situation</h3><p>These are not multiple choice. Decide what you would do before revealing the coaching answer.</p>
 ${m.scenarios.map((s,i)=>`<div class="scenario"><h4>Scenario ${i+1}</h4><div>${s[0]}</div><button class="secondary" onclick="document.getElementById('sc${i}').style.display='block';this.disabled=true">REVEAL COACHING ANSWER</button><div class="answer" id="sc${i}">${s[1]}</div></div>`).join("")}</div>`;
}

function activity(m){
 if(!act)act={items:shuffle(m.activity.items.map((x,i)=>({text:x[0],bin:x[1],id:i,placed:null}))),sel:null};
 return `<div class="activity"><div class="kicker">INTERACTIVE APPLICATION</div><h3>🧩 ${m.activity.title}</h3><p>Drag a card into a category. On a touchscreen, tap a card and then tap its category. Wrong placements do not reveal the answer.</p>
 <div class="bank">${act.items.filter(x=>x.placed===null).map(x=>`<div class="drag" draggable="true" data-id="${x.id}">${x.text}</div>`).join("")}</div>
 <div class="zones" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">${m.activity.bins.map((b,bi)=>`<div class="zone" data-bin="${bi}"><b>${b}</b><br>${act.items.filter(x=>x.placed===bi).map(x=>`<span class="chip">${x.text}</span>`).join("")}</div>`).join("")}</div>
 <div id="af">${actDone?"✅ Application complete. Assessment unlocked.":"Complete every placement correctly to unlock the assessment."}</div></div>`;
}
function setup(){
 let dragged=null;
 document.querySelectorAll(".drag").forEach(c=>{
  c.ondragstart=()=>{dragged=+c.dataset.id};
  c.onclick=()=>{document.querySelectorAll(".drag").forEach(x=>x.classList.remove("sel"));act.sel=act.sel===+c.dataset.id?null:+c.dataset.id;if(act.sel!==null)c.classList.add("sel")};
 });
 document.querySelectorAll(".zone").forEach(z=>{
  z.ondragover=e=>e.preventDefault();
  z.ondrop=e=>{e.preventDefault();if(dragged!==null)placeAct(dragged,+z.dataset.bin)};
  z.onclick=()=>{if(act.sel!==null)placeAct(act.sel,+z.dataset.bin)};
 });
}
function placeAct(id,bin){
 let x=act.items.find(i=>i.id===id); if(!x||x.placed!==null)return;
 if(x.bin===bin){x.placed=bin;act.sel=null;actDone=act.items.every(i=>i.placed!==null);renderLesson()}
 else{$("af").textContent="❌ That placement does not fit the reading. Recheck the lesson and try again.";$("af").style.color="#ffb3c0";act.sel=null;document.querySelectorAll(".drag").forEach(c=>c.classList.remove("sel"))}
}
function openLesson(i){cur=i;qi=0;mc=0;locked=false;act=null;actDone=false;$("home").classList.add("hidden");$("board").classList.add("hidden");$("lesson").classList.remove("hidden");renderLesson();scrollTo(0,0)}
function renderLesson(){
 let m=modules[cur],q=m.questions[qi];
 choices=shuffle(q[1].map((t,i)=>({t,ok:i===q[2]})));
 $("lesson").innerHTML=`<div class="card">
 <div class="kicker">${m.id} • ADVANCED SKILL MISSION ${cur+1}/${modules.length}</div>
 <div class="emoji">${m.icon}</div><h1>${m.title}</h1><h3 class="muted">${m.subtitle}</h3>
 <div class="lesson-stats"><span class="statpill">📖 ${m.cards.length} READING SECTIONS</span><span class="statpill">🏐 ${m.scenarios.length} COURT SCENARIOS</span><span class="statpill">🧩 INTERACTIVE APPLICATION</span><span class="statpill">🧠 ${m.questions.length} ASSESSMENT QUESTIONS</span></div>
 ${diagram(m)}
 ${m.video?`<div class="read"><div class="kicker">FILM STUDY</div><h3>🎥 Watch the Technique</h3><p>Watch for the same cues you are reading about. Do not just watch the ball. Watch the athlete's feet, body position, contact, and transition.</p><div class="video"><iframe src="${m.video}" allowfullscreen></iframe></div></div>`:""}
 <div class="kicker">DEEP-DIVE READING</div>
 ${m.cards.map(c=>`<div class="read"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}
 ${scenarios(m)}
 ${activity(m)}
 <hr><div class="kicker">ASSESSMENT • QUESTION ${qi+1}/${m.questions.length}</div><h3>${q[0]}</h3>
 <div class="choices">${choices.map((x,j)=>`<button class="choice" ${actDone?"":"disabled"} onclick="answer(${j},this)">${String.fromCharCode(65+j)}. ${x.t}</button>`).join("")}</div>
 <div id="fb"></div><div class="nav"><button class="secondary" onclick="goHome()">← Unit Map</button><button id="next" class="primary hidden" onclick="nextQ()">${qi===m.questions.length-1?"FINISH ✓":"NEXT →"}</button></div></div>`;
 locked=false;setup();
}
function answer(j,b){if(locked)return;locked=true;state.attempted++;let ci=choices.findIndex(x=>x.ok);document.querySelectorAll(".choice").forEach((x,i)=>{x.disabled=true;if(i===ci)x.classList.add("correct")});if(choices[j].ok){mc++;state.correct++;$("fb").className="feedback";$("fb").textContent="✅ Correct."}else{b.classList.add("wrong");$("fb").className="feedback";$("fb").textContent="❌ Best answer: "+choices[ci].t}$("next").classList.remove("hidden");save()}
function nextQ(){let m=modules[cur];if(qi<m.questions.length-1){qi++;renderLesson();document.querySelector("hr").scrollIntoView({behavior:"smooth"})}else finish()}
function finish(){let m=modules[cur],earned=Math.round(mc/m.questions.length*100),old=state.done[m.id]?.score||0;if(earned>old)state.score+=earned-old;state.done[m.id]={score:Math.max(old,earned)};save();$("lesson").innerHTML=`<div class="card"><div class="rank">${earned>=90?"SKILL MASTER":earned>=80?"COURT READY":earned>=70?"DEVELOPING":"RETRAIN"}</div><h2>${m.title} Complete</h2><p>You answered <b>${mc}/${m.questions.length}</b> correctly and earned <b>${earned} IQ</b>. Replay the mission to improve your best score.</p><div class="nav"><button class="secondary" onclick="openLesson(${cur})">REPLAY MISSION</button><button class="primary" onclick="goHome()">UNIT MAP →</button></div></div>`}
function goHome(){$("lesson").classList.add("hidden");$("board").classList.add("hidden");$("home").classList.remove("hidden");renderGrid();scrollTo(0,0)}
function showBoard(){profiles=load();let a=Object.values(profiles).sort((a,b)=>b.score-a.score);$("home").classList.add("hidden");$("lesson").classList.add("hidden");$("board").classList.remove("hidden");$("rows").innerHTML=a.map((p,i)=>`<div class="read"><b>#${i+1} ${p.name}</b> • ${p.score} IQ • ${Object.keys(p.done||{}).length}/${modules.length} mastered</div>`).join("")||"No scores yet."}
function reset(){if(!state.name){$("welcome").textContent="Lock in a player first.";return}if(!resetArmed){resetArmed=true;$("resetBtn").textContent="⚠ CLICK AGAIN TO CONFIRM";setTimeout(()=>{resetArmed=false;$("resetBtn").textContent="↻ RESET THIS PLAYER"},5000);return}resetArmed=false;let n=state.name;state=blank(n);profiles=load();profiles[key(n)]=state;localStorage.setItem(KEY,JSON.stringify(profiles));act=null;actDone=false;$("resetBtn").textContent="↻ RESET THIS PLAYER";$("welcome").textContent="✓ "+n+" reset to 0 IQ and 0 mastered skills.";renderGrid()}
$("lock").onclick=lockName;$("name").onkeydown=e=>{if(e.key==="Enter")lockName()};$("boardBtn").onclick=showBoard;$("resetBtn").onclick=reset;renderGrid();if(state.name)$("welcome").textContent="🏐 Welcome back, "+state.name+".";
</script></body></html>
