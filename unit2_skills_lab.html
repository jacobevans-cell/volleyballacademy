}.diagram{background:#f8fafc;color:#111;border-radius:16px;padding:14px;margin:16px 0;text-align:center}.diagram svg{max-width:720px;width:100%;height:250px}.activity{background:#ffffff09;border-radius:16px;padding:16px;margin:18px 0}.bank{display:flex;flex-wrap:wrap;gap:8px}.drag{padding:9px;background:#ffffff12;border:2px solid #ffffff25;border-radius:10px;cursor:pointer}.drag.sel{border-color:#fbbf24}.zones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.zone{border:2px dashed #ffffff35;border-radius:12px;min-height:110px;padding:10px}.chip{display:inline-block;padding:5px 7px;margin:3px;background:#ffffff13;border-radius:8px}.choices{display:grid;gap:8px}.choice{text-align:left;background:#ffffff0c;color:#fff;border:2px solid #ffffff20}.choice.correct{background:#064e3b}.choice.wrong{background:#651a2a}.feedback{padding:10px;font-weight:800}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:15px}.kicker{color:#fbbf24;font-size:12px;font-weight:1000;letter-spacing:1px}.rank{text-align:center;font-size:48px;color:#fbbf24;font-weight:1000}

<script>
const modules=[{"id": "2P", "icon": "\ud83c\udfdb\ufe0f", "title": "The Pyramid of Organized Volleyball", "subtitle": "From Local Courts to Elite Competition", "cards": [["Local Foundation", "Organized volleyball is built like a pyramid. The widest level is local: school teams, clubs, recreation programs, camps, and community leagues. This is where the greatest number of athletes learn the game. The upper levels become narrower because competition, training demands, decision-making, and consistency increase."], ["Regional Development", "Regional competition connects developing teams to stronger opponents and larger events. Players learn that advancement is not a jump from beginner to elite. It is a long process of practice, coaching, competition, reflection, and improvement."], ["National Competition", "National organizations help organize championships, education, officiating, athlete development, and high-performance opportunities. In the United States, USA Volleyball provides resources for players, coaches, officials, clubs, and national teams."], ["Elite Pathways", "At the elite level, athletes perform the same fundamentals learned at the base of the pyramid, but at much greater speed and precision. Passing, setting, serving, attacking, blocking, and digging do not disappear. They become more reliable under pressure."]], "video": null, "activity": {"bins": ["STRONG / CORRECT", "WEAK / INCORRECT"], "items": [["School team practice", 0], ["Regional tournament", 0], ["National pathway", 0], ["Skip fundamentals", 1], ["Avoid local competition", 1], ["Ignore development", 1]]}, "questions": [["Why is the pyramid widest at the bottom?", ["It includes the most participants", "It uses the tallest volleyball nets", "It contains only elite athletes", "It has the hardest competition"], 0], ["What increases higher in the pyramid?", ["Competition and performance demands", "The number of beginning players", "The need to skip basic skills", "The size of every volleyball court"], 0], ["Why do elite players still train fundamentals?", ["Advanced play depends on reliable basics", "Elite volleyball removes first contact", "Only beginners need ball control", "National teams use different contacts"], 0], ["What belongs at the local foundation?", ["Schools, clubs, and recreation teams", "Only national championship teams", "Only international national teams", "Professional broadcast organizations"], 0], ["What does regional competition provide?", ["Stronger opponents and development", "Guaranteed professional contracts", "A reason to stop skill practice", "Automatic national-team selection"], 0], ["What is the best use of the pyramid?", ["Build each level on strong foundations", "Skip levels as quickly as possible", "Focus only on the highest level", "Avoid competition while developing"], 0], ["What changes most at elite levels?", ["Speed, precision, and consistency", "The basic objective of volleyball", "The three-contact team concept", "The importance of communication"], 0]]}, {"id": "2A", "icon": "\ud83e\uddf1", "title": "Passing (Bump)", "subtitle": "Control First Contact With Your Platform", "cards": [["Platform", "Forearm passing is controlled rebounding, not a giant swing. The incoming ball already has energy. The passer creates a broad, even platform with the forearms and uses its angle to redirect the ball toward the setter."], ["Footwork", "Good passing begins with the feet. Read the server, move efficiently, and become balanced before contact whenever possible. USA Volleyball coaches emphasize calm footwork because extra movement can leave a passer unstable when the ball arrives."], ["Angles", "The forearms should create one predictable surface. Straight elbows and an even platform help the ball rebound consistently. Think of the platform like a ramp: change the ramp angle and the ball changes direction."], ["Reading", "Reading begins before contact. Watch the server, speed, trajectory, and direction. A passer who recognizes the flight early can move into position instead of reaching desperately at the last second."], ["Finish", "After contact, hold or 'stick' the platform briefly toward the target. Then transition to the next responsibility. A great pass is not the most dramatic one; it is the one that lets the team run offense."]], "video": "https://www.youtube.com/embed/DdMQns95WDI", "activity": {"bins": ["STRONG / CORRECT", "WEAK / INCORRECT"], "items": [["Balanced before contact", 0], ["Platform faces target", 0], ["Read serve early", 0], ["Huge arm swing", 1], ["Separate elbows", 1], ["Keep running at contact", 1]]}, "questions": [["What mainly directs a forearm pass?", ["The angle of the passing platform", "The color of the player's jersey", "The height of the volleyball net", "The number on the scoreboard"], 0], ["Why get balanced before contact?", ["It improves control of the platform", "It makes the incoming ball slower", "It prevents teammates from rotating", "It guarantees a perfect first pass"], 0], ["What is a common passing error?", ["Swinging the arms too aggressively", "Keeping both elbows straight", "Reading the server before contact", "Facing the platform to target"], 0], ["Why keep both forearms even?", ["They create a predictable surface", "They allow the ball to be caught", "They create an extra team contact", "They automatically produce topspin"], 0], ["When should serve reading begin?", ["Before the ball reaches the passer", "After the ball hits the platform", "After the setter touches the ball", "Once the ball crosses the end line"], 0], ["What does sticking the platform mean?", ["Hold its angle briefly after contact", "Swing both arms above the head", "Catch the ball between the arms", "Turn away immediately after contact"], 0], ["Which pass is most valuable?", ["A controlled pass the setter can use", "The highest pass anywhere in the gym", "The hardest pass toward the net", "A pass returned over on first contact"], 0]]}, {"id": "2B", "icon": "\ud83d\udc50", "title": "Setting", "subtitle": "Turn Contact Two Into an Attack", "cards": [["Purpose", "Setting usually connects the first contact to the attack. The goal is not simply to put the ball in the air. A useful set reaches the hitter at a predictable height, location, and tempo so the attacker can approach with confidence."], ["Get Under It", "Move early and get underneath the ball. When the setter arrives balanced, the legs, body, arms, and hands can work together. Reaching sideways at the last moment forces the hands to rescue poor body position."], ["Hands", "Shape the hands naturally around the ball above the forehead. The fingers control the ball and release it quickly. A triangle-like window between the thumbs and index fingers can help beginners organize their hand position."], ["Whole Body", "Setting power should travel from the floor through the body. USA Volleyball guidance emphasizes full extension instead of jabbing at the ball with bent arms. Consistent body mechanics make location more repeatable."], ["Tempo", "Different hitters need different sets. Middles may attack a fast ball near the setter while outside hitters often use a higher set toward the antenna. A setter combines technique with decision-making."]], "video": "https://www.youtube.com/embed/sFxs0EPD68Q", "activity": {"bins": ["STRONG / CORRECT", "WEAK / INCORRECT"], "items": [["Move under the ball", 0], ["Extend toward target", 0], ["Shape hands around ball", 0], ["Reach sideways late", 1], ["Hold ball in palms", 1], ["Jab with bent arms", 1]]}, "questions": [["What is the main purpose of a set?", ["Create an attackable ball for a hitter", "Send every second ball over the net", "Give the setter time to leave court", "Make every rally use three contacts"], 0], ["Why move underneath the ball?", ["It improves balance and body control", "It makes the volleyball feel lighter", "It guarantees the hitter will score", "It prevents opponents from blocking"], 0], ["What should control the ball when setting?", ["The fingers with shaped open hands", "The palms holding the ball briefly", "The forearms locked into a platform", "The fists striking above the forehead"], 0], ["Why use full extension?", ["It supports accuracy and follow-through", "It lets the setter hold the ball longer", "It makes every set travel backward", "It removes the need to use the legs"], 0], ["How may a middle set differ?", ["It often uses a quicker ball tempo", "It must always travel much higher", "It gives the team a fourth contact", "It cannot be set close to the setter"], 0], ["Why should non-setters practice setting?", ["They may need the second contact", "Only setters are allowed to pass", "It removes their defensive duties", "They can replace the referee setter"], 0], ["Which set is most useful?", ["One matching hitter timing and location", "The highest ball possible every time", "The hardest ball pushed from the hands", "One that surprises its own attacker"], 0]]}, {"id": "2C", "icon": "\ud83c\udfaf", "title": "Serving", "subtitle": "Start the Rally With Purpose", "cards": [["Control", "Serving is the only major volleyball skill that begins completely under your control. No opponent sends the ball to you first. Your stance, routine, toss or release, contact, and target create the rally's first pressure."], ["Underhand", "An underhand serve uses a balanced stance, a steady ball, and a pendulum-like arm swing. Contact should be firm and directed toward the target. The motion is controlled rather than a desperate upward scoop."], ["Overhand", "For an overhand serve, place the toss or release in a repeatable window in front of the hitting shoulder. A poor toss forces the server to chase, lean, or change the swing. Consistency starts with a consistent contact point."], ["Contact", "A firm hand transfers energy to the ball more predictably. The body and arm continue toward the target after contact. Power comes from coordinated movement, not simply trying to slap the ball as hard as possible."], ["Targets", "Once a player can serve in bounds reliably, placement becomes a weapon. Deep zones, short zones, sidelines, and seams between passers can create difficulty even without extreme speed."]], "video": null, "activity": {"bins": ["STRONG / CORRECT", "WEAK / INCORRECT"], "items": [["Repeatable routine", 0], ["Firm contact", 0], ["Choose a target", 0], ["Chase a wild toss", 1], ["Change routine every serve", 1], ["Swing without a target", 1]]}, "questions": [["Why is serving unique?", ["The player controls how the skill begins", "The server receives an opponent pass", "The server gets unlimited contacts", "The opponent controls the first toss"], 0], ["What makes a useful overhand toss?", ["A repeatable ball in the contact window", "A toss reaching the gym ceiling", "A toss forcing the server to chase", "A toss spinning as fast as possible"], 0], ["Why use a firm contact hand?", ["It transfers energy more consistently", "It allows the ball to be held longer", "It makes every serve curve sideways", "It guarantees an automatic service ace"], 0], ["What should developing servers value first?", ["Reliable serves landing in bounds", "Maximum speed on every attempt", "Advanced jump serves before control", "A different technique every serve"], 0], ["Why can placement beat raw speed?", ["It can force passers to move or decide", "Slow serves are worth extra points", "Passers cannot move toward slow balls", "Officials reward accurate target serves"], 0], ["What does a routine help create?", ["Repeatable focus and mechanics", "A longer delay before every rally", "A different toss on every serve", "A warning of the exact target"], 0], ["Which target may cause confusion?", ["The seam between two passers", "The serving team's own bench", "The referee stand beside the net", "The floor behind the end line"], 0]]}, {"id": "2D", "icon": "\ud83d\udca5", "title": "Hitting (Spiking)", "subtitle": "Approach, Jump, See, Attack", "cards": [["Approach", "A strong attack combines timing, footwork, jumping, arm mechanics, vision, and decision-making. The hitter must arrive at the right place at the right time. A powerful swing cannot rescue an approach that puts the hitter underneath or behind the ball."], ["Acceleration", "USA Volleyball attacking guidance describes a 'slow to fast' approach. The hitter builds rhythm and becomes explosive near the end instead of sprinting at maximum speed from the first step."], ["Last Steps", "The final step-close is especially important. Those steps help position the feet relative to the ball and convert forward movement into a controlled jump. Good feet give the hitter more attacking options."], ["Contact", "Contact the ball high and in front of the hitting shoulder with an open hand. Reaching high improves attacking angle. Contacting too far behind the head reduces both power and control."], ["Vision", "Smart hitters see the block and defense. Power is one tool, but tips, roll shots, deep placement, sharp angles, and using the block can all score. The best attack fits the situation."]], "video": null, "activity": {"bins": ["STRONG / CORRECT", "WEAK / INCORRECT"], "items": [["Accelerate final steps", 0], ["Contact high in front", 0], ["Read the block", 0], ["Sprint full speed immediately", 1], ["Contact behind head", 1], ["Ignore the defense", 1]]}, "questions": [["Why does the approach matter?", ["It positions the hitter for contact", "It decides which team serves next", "It gives the hitter another contact", "It prevents defenders from moving"], 0], ["What does slow-to-fast describe?", ["An approach accelerating near the jump", "A serve losing speed over the net", "A set stopping before the attacker", "A blocker moving away from the hitter"], 0], ["Why are final steps important?", ["They organize takeoff under the ball", "They tell the setter where to stand", "They determine the official rotation", "They replace the need for arm swing"], 0], ["Where should contact usually occur?", ["High and in front of hitting shoulder", "Low and behind the hitter's head", "At chest level using both hands", "Near the waist after the landing"], 0], ["Why should hitters see the defense?", ["To choose a smarter attacking option", "To decide whether the rally counts", "To see which teammate serves next", "To know when the referee whistles"], 0], ["Which attack shows good decision-making?", ["Tip into space behind a strong block", "Swing directly into every double block", "Ignore defenders and always hit hard", "Stop approaching when a block appears"], 0], ["What follows a controlled landing?", ["Prepare immediately for the next play", "Watch the ball until rally finishes", "Leave the court before next contact", "Stay at the net without moving"], 0]]}, {"id": "2E", "icon": "\ud83d\udea7", "title": "Blocking", "subtitle": "Read, Move, Press Over", "cards": [["Read", "Blocking starts with reading. Good blockers gather information from the pass, setter, set, and hitter instead of jumping because something near the net looked exciting."], ["Ready", "Begin balanced with bent knees and the body ready to move laterally. Standing too tall slows the first movement. Useful spacing from the net also helps the blocker avoid net contact and press the hands forward."], ["Footwork", "Footwork gets the blocker to the attack point. Shuffles, crossover steps, or swing-blocking patterns may be used depending on distance and team system. The important goal is arriving under control rather than drifting sideways."], ["Press", "USA Volleyball coaches emphasize reaching over the net, not merely high above it. Pressing the hands across the plane of the net takes away court and can direct the attacked ball downward."], ["Team Wall", "Two blockers should create one wall. A seam between them gives the attacker a target. Even when a block does not touch the ball, it can funnel the attack toward a waiting defender."]], "video": "https://www.youtube.com/embed/jti8vE6BnFw", "activity": {"bins": ["STRONG / CORRECT", "WEAK / INCORRECT"], "items": [["Read setter and hitter", 0], ["Press hands over net", 0], ["Arrive balanced", 0], ["Guess before reading", 1], ["Drift sideways in air", 1], ["Leave a seam", 1]]}, "questions": [["What should happen before a blocker jumps?", ["Read the developing offensive play", "Watch only the scoreboard numbers", "Guess from the previous rally", "Wait until the ball hits the floor"], 0], ["Why use a low ready position?", ["It supports faster explosive movement", "It makes the volleyball net shorter", "It prevents the setter from attacking", "It guarantees a successful block"], 0], ["Why avoid sideways drift?", ["It improves controlled block position", "Officials require perfectly straight jumps", "Drifting changes the team's rotation", "It makes the volleyball travel faster"], 0], ["Why press hands over the net?", ["It takes away more attacking space", "It allows blockers to catch the ball", "It gives the opponent fewer contacts", "It removes the need for defenders"], 0], ["What is the seam in a double block?", ["The gap between the two blockers", "The line beneath the volleyball net", "The space behind the serving player", "The boundary between two rotations"], 0], ["Can a block help without contact?", ["Yes, it can funnel attacks to defense", "No, only touched balls help defense", "Yes, but only on the final point", "No, every block must score a point"], 0], ["Which is the strongest sequence?", ["Read, move, stop, jump, and press", "Jump, guess, drift, and turn away", "Serve, pass, set, and leave net", "Run, catch, and throw the ball down"], 0]]}, {"id": "2F", "icon": "\ud83d\udee1\ufe0f", "title": "Digging", "subtitle": "Read the Hitter and Keep It Alive", "cards": [["Before Contact", "Defense begins before the hitter contacts the ball. Defenders read the pass, setter, set location, approach, shoulders, and arm swing. Reading allows a defender to anticipate without blindly guessing."], ["Get Stopped", "USA Volleyball repeatedly emphasizes being stopped when the hitter contacts the ball. A balanced defender can react in several directions. A player still running one way may struggle to reverse direction."], ["Position", "Defensive base position changes with the set, hitter, block, and opponent tendencies. A tight set creates different attacking options than a ball far off the net. There is no single magic spot for every rally."], ["Read Hitter", "Approach angle, shoulders, feet, and arm speed provide clues. A full aggressive approach may suggest a hard swing. A slower approach or visible hand can warn of an off-speed shot."], ["Control", "Making contact is only part of digging. The best dig stays playable for a teammate so the team can transition into offense. Relentless effort matters, but disciplined reading can prevent the desperate dive in the first place."]], "video": "https://www.youtube.com/embed/Ix_zeZ4X9Vo", "activity": {"bins": ["STRONG / CORRECT", "WEAK / INCORRECT"], "items": [["Stop at hitter contact", 0], ["Read approach clues", 0], ["Control the dig", 0], ["Guess before the set", 1], ["Run during hitter contact", 1], ["Hide behind the block", 1]]}, "questions": [["When does digging preparation begin?", ["Before the hitter contacts the ball", "Only after attack crosses the net", "After the defender touches the ball", "Once the rally has already ended"], 0], ["Why stop at hitter contact?", ["A balanced body can react either way", "The rules require defenders to freeze", "It makes every attack travel slower", "It prevents teammates from blocking"], 0], ["Why does base position change?", ["The set, hitter, and block change options", "The court changes size during rallies", "Defenders rotate after every contact", "Officials assign a spot every rally"], 0], ["What can a slower approach suggest?", ["An off-speed attack may be coming", "The hitter will definitely hit line", "The rally has already been stopped", "The setter must take another contact"], 0], ["What is better than touching the attack?", ["Controlling the dig for a teammate", "Sending every dig into the bleachers", "Catching the ball before it lands", "Digging directly to the opponent"], 0], ["Why avoid guessing too early?", ["The attacker may choose another option", "Guessing gives opponents two points", "Officials penalize early movement", "The block cannot move after a guess"], 0], ["Which sequence shows strong defense?", ["Read, move, stop, react, and control", "Guess, sprint, turn, and hope", "Stand still for the entire rally", "Watch only the ball after contact"], 0]]}];
const $=id=>document.getElementById(id), KEY="vb_u2_profiles",ACTIVE="vb_u2_active";const blank=n=>({name:n,score:0,done:{},correct:0,attempted:0}),key=n=>(n||"").trim().toLowerCase(),load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}};let profiles=load(),active=localStorage.getItem(ACTIVE)||"",state=profiles[key(active)]||blank(active),cur=0,qi=0,mc=0,locked=false,choices=[],act=null,actDone=false,resetArmed=false;
function save(){if(state.name){profiles=load();profiles[key(state.name)]=state;localStorage.setItem(KEY,JSON.stringify(profiles));localStorage.setItem(ACTIVE,state.name)}topbar()}function topbar(){$("score").textContent=state.score;$("fill").style.width=(Object.keys(state.done).length/modules.length*100)+"%"}
function renderGrid(){$("name").value=state.name||"";$("grid").innerHTML=modules.map((m,i)=>`<div class="module ${state.done[m.id]?"done":""}" onclick="openLesson(${i})"><small>${m.id}</small><div class="emoji">${m.icon}</div><h3>${m.title}</h3><p>${m.subtitle}</p></div>`).join("");topbar()}
function lockName(){let n=$("name").value.trim();if(!n){$("welcome").textContent="Enter a player name first.";return}profiles=load();state=profiles[key(n)]||blank(n);state.name=n;save();$("welcome").textContent="🏐 "+(state.score?"Welcome back, ":"Welcome to Skills Lab, ")+n+"!";renderGrid()}
function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function diagram(m){let labels=m.cards.slice(0,5).map((c,i)=>`<text x="${90+i*135}" y="${185-(i%2)*55}" text-anchor="middle" font-size="16" font-weight="700">${c[0]}</text><circle cx="${90+i*135}" cy="${115-(i%2)*55}" r="28" fill="${i%2?"#8b5cf6":"#22d3ee"}"/><text x="${90+i*135}" y="${122-(i%2)*55}" text-anchor="middle" font-size="18" fill="white">${i+1}</text>`).join("");return `<div class="diagram"><h3>📊 ${m.title} Skill Map</h3><svg viewBox="0 0 720 250"><path d="M90 115 L225 60 L360 115 L495 60 L630 115" fill="none" stroke="#334155" stroke-width="5"/>${labels}</svg><b>Study the sequence and connect each cue to the reading below.</b></div>`}
function activity(m){if(!act)act={items:shuffle(m.activity.items.map((x,i)=>({text:x[0],bin:x[1],id:i,placed:null}))),sel:null};return `<div class="activity"><div class="kicker">INTERACTIVE SKILL SORT</div><h3>Drag or tap each card into the correct side.</h3><div class="bank">${act.items.filter(x=>x.placed===null).map(x=>`<div class="drag" data-id="${x.id}">${x.text}</div>`).join("")}</div><div class="zones">${m.activity.bins.map((b,bi)=>`<div class="zone" data-bin="${bi}"><b>${b}</b><br>${act.items.filter(x=>x.placed===bi).map(x=>`<span class="chip">${x.text}</span>`).join("")}</div>`).join("")}</div><div id="af">${actDone?"✅ Sort complete. Questions unlocked.":"Complete the sort to unlock the questions."}</div></div>`}
function setup(){document.querySelectorAll(".drag").forEach(c=>c.onclick=()=>{document.querySelectorAll(".drag").forEach(x=>x.classList.remove("sel"));act.sel=+c.dataset.id;c.classList.add("sel")});document.querySelectorAll(".zone").forEach(z=>z.onclick=()=>{if(act.sel===null)return;let x=act.items.find(i=>i.id===act.sel);if(x.bin===+z.dataset.bin){x.placed=+z.dataset.bin;act.sel=null;actDone=act.items.every(i=>i.placed!==null);renderLesson()}else{$("af").textContent="❌ Re-read the cue and try again.";act.sel=null}})}
function openLesson(i){cur=i;qi=0;mc=0;locked=false;act=null;actDone=false;$("home").classList.add("hidden");$("board").classList.add("hidden");$("lesson").classList.remove("hidden");renderLesson();scrollTo(0,0)}
function renderLesson(){let m=modules[cur],q=m.questions[qi];choices=shuffle(q[1].map((t,i)=>({t,ok:i===q[2]})));$("lesson").innerHTML=`<div class="card"><div class="kicker">${m.id} • SKILL MISSION ${cur+1}/${modules.length}</div><div class="emoji">${m.icon}</div><h1>${m.title}</h1><h3 class="muted">${m.subtitle}</h3>${diagram(m)}${m.video?`<div class="video"><iframe src="${m.video}" allowfullscreen></iframe></div>`:""}${m.cards.map(c=>`<div class="read"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}${activity(m)}<hr><div class="kicker">QUESTION ${qi+1}/7</div><h3>${q[0]}</h3><div class="choices">${choices.map((x,j)=>`<button class="choice" ${actDone?"":"disabled"} onclick="answer(${j},this)">${String.fromCharCode(65+j)}. ${x.t}</button>`).join("")}</div><div id="fb"></div><div class="nav"><button class="secondary" onclick="goHome()">← Unit Map</button><button id="next" class="primary hidden" onclick="nextQ()">${qi===6?"FINISH ✓":"NEXT →"}</button></div></div>`;locked=false;setup()}
function answer(j,b){if(locked)return;locked=true;state.attempted++;let ci=choices.findIndex(x=>x.ok);document.querySelectorAll(".choice").forEach((x,i)=>{x.disabled=true;if(i===ci)x.classList.add("correct")});if(choices[j].ok){mc++;state.correct++;$("fb").className="feedback";$("fb").textContent="✅ Correct."}else{b.classList.add("wrong");$("fb").className="feedback";$("fb").textContent="❌ Best answer: "+choices[ci].t}$("next").classList.remove("hidden");save()}
function nextQ(){if(qi<6){qi++;renderLesson();document.querySelector("hr").scrollIntoView({behavior:"smooth"})}else finish()}
function finish(){let m=modules[cur],earned=Math.round(mc/7*100),old=state.done[m.id]?.score||0;if(earned>old)state.score+=earned-old;state.done[m.id]={score:Math.max(old,earned)};save();$("lesson").innerHTML=`<div class="card"><div class="rank">${earned>=90?"SKILL MASTER":earned>=75?"COURT READY":earned>=60?"BUILDING":"RETRAIN"}</div><h2>${m.title} Complete</h2><p>You earned ${earned} IQ.</p><button class="primary" onclick="goHome()">UNIT MAP →</button></div>`}
function goHome(){$("lesson").classList.add("hidden");$("board").classList.add("hidden");$("home").classList.remove("hidden");renderGrid();scrollTo(0,0)}
function showBoard(){profiles=load();let a=Object.values(profiles).sort((a,b)=>b.score-a.score);$("home").classList.add("hidden");$("lesson").classList.add("hidden");$("board").classList.remove("hidden");$("rows").innerHTML=a.map((p,i)=>`<div class="read"><b>#${i+1} ${p.name}</b> • ${p.score} IQ • ${Object.keys(p.done||{}).length}/7 mastered</div>`).join("")||"No scores yet."}
function reset(){if(!state.name){$("welcome").textContent="Lock in a player first.";return}if(!resetArmed){resetArmed=true;$("resetBtn").textContent="⚠ CLICK AGAIN TO CONFIRM";setTimeout(()=>{resetArmed=false;$("resetBtn").textContent="↻ RESET THIS PLAYER"},5000);return}resetArmed=false;let n=state.name;state=blank(n);profiles=load();profiles[key(n)]=state;localStorage.setItem(KEY,JSON.stringify(profiles));act=null;actDone=false;$("resetBtn").textContent="↻ RESET THIS PLAYER";$("welcome").textContent="✓ "+n+" reset to 0 IQ and 0 mastered skills.";renderGrid()}
$("lock").onclick=lockName;$("name").onkeydown=e=>{if(e.key==="Enter")lockName()};$("boardBtn").onclick=showBoard;$("resetBtn").onclick=reset;renderGrid();if(state.name)$("welcome").textContent="🏐 Welcome back, "+state.name+".";
</script></body></html>
